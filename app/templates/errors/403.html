{% extends 'base.html' %}

{% block title %}403 Forbidden - DevScribe{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-lg rounded-4 p-5 bg-white">
        <div class="text-danger mb-3">
          <i class="bi bi-shield-lock-fill display-1"></i>
        </div>
        <h1 class="display-5 fw-bold mb-2">403</h1>
        <h2 class="h4 fw-bold mb-3 text-secondary">Access Forbidden</h2>
        <p class="text-muted mb-4">
          You do not have permission to access or modify this resource. Only authorized resource owners can perform this action.
        </p>
        <div>
          <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 fw-semibold me-2">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
          <a href="{{ url_for('auth.dashboard') }}" class="btn btn-outline-secondary px-4">
            <i class="bi bi-speedometer2 me-1"></i> Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
