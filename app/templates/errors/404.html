{% extends 'base.html' %}

{% block title %}404 Not Found - DevScribe{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-lg rounded-4 p-5 bg-white">
        <div class="text-primary mb-3">
          <i class="bi bi-compass display-1"></i>
        </div>
        <h1 class="display-5 fw-bold mb-2">404</h1>
        <h2 class="h4 fw-bold mb-3 text-secondary">Page Not Found</h2>
        <p class="text-muted mb-4">
          The page or article you are looking for doesn't exist, was moved, or has been deleted.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 fw-semibold">
            <i class="bi bi-house me-1"></i> Back to Home
          </a>
          <a href="{{ url_for('posts.all_posts') }}" class="btn btn-outline-primary px-4">
            <i class="bi bi-journal-text me-1"></i> Browse Articles
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
